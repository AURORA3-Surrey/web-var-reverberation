# Reconstructed record. The set was measured on 19 November 2026, before the
# data conventions were in use. This file was put together afterwards from the
# plots and e-mails about that day and from the control software, so it is not
# a record made at capture:
# - The time of day is not known. The time in the ID is a serial number.
# - The wall's position is the controller's, 100 on its scale of 0 to 100, which
#   the control software turns into a clear length of 7.976 m between the
#   panels (1.912 m at 0, 7.976 m at 100), and so into the volume on the plot,
#   124.72 m³. The 0.33 m depth of the entrance wall's panels is added to
#   give the distance from that wall, which is an assumption.
# - The plot gives the share of panels open, 0.75. Which panels that was is
#   worked out with the control software's rule (`set_wall_absorption.py`):
#   the share is spread evenly over the panels in front of the moving wall,
#   wall by wall. That the measurement used that rule is an assumption.
# - The curtains had been taken down.
# - Not recorded, and so left out: project, operator, doors, temperature and
#   humidity, what was in the room and on its floor, loudspeakers, microphones,
#   excitation, software and files.
