# A notice shown above the list, for as long as it is here.
notice: >-
  Preliminary measurements. The room is still being tested and adjusted by its
  acoustic contractor, so these values may change.

# The configurations the applet offers, in the order it lists them. `result`
# names a derived result as the data conventions do: the ID of the set, then the
# result's own.
options:
  - title: Largest room, all reflective
    result: VAR_20261119T000001Z_d01
  - title: Largest room, all reflective, curtains parked
    result: VAR_20261105T000001Z_d01
  - title: Largest room, all absorptive
    result: VAR_20261119T000002Z_d01
  - title: Smallest room, all reflective
    result: VAR_20261119T000003Z_d01
  - title: Smallest room, all absorptive
    result: VAR_20261119T000004Z_d01

# The bands left out of the chart and its table, by centre frequency, whatever
# the sets hold. The 63 Hz band is out until its values can be trusted.
leave_out_hz: [63]

# The curves from the literature that the chart can be compared with, one at a
# time, in the order its menu lists them: the names of the files in references/.
# The first is shown to begin with.
references:
  - traer-mcdermott-2016
